<div class="NgxEditor__Wrapper w-full">
  <ngx-editor-menu
    [editor]="editor"
    [toolbar]="toolbar()"
    class="sticky top-0 z-4"
  >
  </ngx-editor-menu>
  <ngx-editor
    [editor]="editor"
    [(ngModel)]="html"
    (ngModelChange)="valueChange.emit($event)"
    [disabled]="false"
    [placeholder]="'Type your notes here...'"
    class="block"
  ></ngx-editor>
</div>
